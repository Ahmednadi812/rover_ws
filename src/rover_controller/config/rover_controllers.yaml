controller_manager:
  ros__parameters:
    update_rate: 100

    simple_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    rover_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: velocity_controllers/JointGroupVelocityController


simple_velocity_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - left_encoder_joint
      - right_wheel_joint
      - right_encoder_joint


gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint